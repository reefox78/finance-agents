server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA — toujours retourner index.html pour le routing côté client
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API → backend FastAPI (réseau Docker interne)
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;

        # Headers forwarding
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (Server-Sent Events pour le scanner)
        proxy_set_header Connection        '';
        proxy_buffering                    off;
        proxy_cache                        off;
        chunked_transfer_encoding          on;
        proxy_read_timeout                 600s;
    }

    # Compression gzip pour les assets Angular
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Cache long pour les assets hachés (Angular outputHashing: all)
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
