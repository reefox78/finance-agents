name: CI — Tests & Build

on:
  push:
    branches: ["main", "develop", "feature/**", "fix/**"]
  pull_request:
    branches: ["main", "develop"]

# Annule les runs en cours si un nouveau push arrive sur la même branche
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
jobs:
# ---------------------------------------------------------------------------

  # ── 1. Tests Python (backend + calculs) ──────────────────────────────────
  test-backend:
    name: 🐍 Tests Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-backend.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements-backend.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v --tb=short
        # Les tests unitaires sont purs (pas d'appels API externes)
        # Aucune variable d'environnement nécessaire

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: .pytest_cache/


  # ── 2. Tests Angular (frontend) ──────────────────────────────────────────
  test-frontend:
    name: 🅰️  Tests Angular
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests (jsdom, headless)
        working-directory: frontend
        run: npm run test:ci


  # ── 3. Build Angular (vérifie la compilation TypeScript) ─────────────────
  build-frontend:
    name: 🏗️  Build Angular
    runs-on: ubuntu-latest
    needs: test-frontend   # on ne build que si les tests passent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7


  # ── 4. Gate de déploiement — tous les jobs doivent être verts ────────────
  all-checks-passed:
    name: ✅ All checks passed
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, build-frontend]
    if: always()

    steps:
      - name: Check all jobs
        run: |
          if [ "${{ needs.test-backend.result }}" != "success" ] || \
             [ "${{ needs.test-frontend.result }}" != "success" ] || \
             [ "${{ needs.build-frontend.result }}" != "success" ]; then
            echo "❌ Un ou plusieurs checks ont échoué."
            echo "   test-backend   : ${{ needs.test-backend.result }}"
            echo "   test-frontend  : ${{ needs.test-frontend.result }}"
            echo "   build-frontend : ${{ needs.build-frontend.result }}"
            exit 1
          fi
          echo "✅ Tous les checks sont verts — prêt pour déploiement."
